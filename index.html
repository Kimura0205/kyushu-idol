<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="写真を選んで作るランキング">
<title>好き顔ランキング</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <p class="eyebrow">PHOTO RANKING</p>
    <h1 id="siteTitle">好き顔ランキング</h1>
    <p id="subtitle">あなたが好きな方を選んでください</p>
  </header>

  <main>
    <section id="voteScreen" class="screen">
      <div class="progress-wrap">
        <div class="progress"><div id="progressBar"></div></div>
        <span id="progressText">1 / 12</span>
      </div>

      <div class="vs-area">
        <button class="person-card" id="leftCard" aria-label="左の写真を選択">
          <div class="photo-wrap"><img id="leftImage" alt=""></div>
          <span id="leftName"></span>
        </button>
        <div class="vs">VS</div>
        <button class="person-card" id="rightCard" aria-label="右の写真を選択">
          <div class="photo-wrap"><img id="rightImage" alt=""></div>
          <span id="rightName"></span>
        </button>
      </div>

      <button id="skipBtn" class="text-button">どちらも選ばない</button>
    </section>

    <section id="resultScreen" class="screen hidden">
      <p class="eyebrow">RESULT</p>
      <h2>あなたの好き顔ランキング</h2>
      <p class="result-note">今回の比較結果をもとにした順位です</p>
      <ol id="rankingList" class="ranking-list"></ol>
      <button id="retryBtn" class="primary-button">もう一度遊ぶ</button>
    </section>

    <section id="manageScreen" class="screen hidden">
      <p class="eyebrow">MANAGE</p>
      <h2>候補者を追加・管理</h2>
      <p class="result-note">名前と写真を入れるだけで候補者を追加できます。</p>

      <form id="addForm" class="manage-form">
        <label>
          <span>名前</span>
          <input id="personName" type="text" maxlength="30" placeholder="例：ここな" required>
        </label>
        <label>
          <span>写真</span>
          <input id="personImage" type="file" accept="image/*" required>
        </label>
        <button class="primary-button" type="submit">候補者を追加</button>
      </form>

      <div class="manage-actions">
        <button id="backBtn" class="secondary-button">ランキング画面に戻る</button>
        <button id="resetPeopleBtn" class="danger-button">初期状態に戻す</button>
      </div>

      <div id="peopleManagerList" class="manager-list"></div>
      <p class="storage-note">※追加した候補者は、このブラウザの保存領域に保存されます。他の人の端末には自動では反映されません。</p>
    </section>
  </main>

  <footer>
    <button id="manageBtn" class="manage-link">⚙ 候補者を管理</button>
    <small>※ 投票結果と候補者データは現在のブラウザ内で管理しています。</small>
  </footer>
</div>
<script src="script.js"></script>
</body>
</html>
